<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵感盒 · 想法与素材</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23f1f1ed'/><path d='M16 6 25 11v10l-9 5-9-5V11z' fill='none' stroke='%230b0c0e' stroke-width='1.5'/><path d='M16 6v10m9-5-9 5-9-5' fill='none' stroke='%230b0c0e' stroke-width='1.2'/></svg>">
</head>
<body>
<div id="app">

  <aside class="side">
    <div class="brand">
      <div class="logo">灵</div>
      <div class="brand-txt">
        <b>灵感盒</b>
        <span>想法 · 素材 · 整理</span>
      </div>
    </div>

    <button class="capture" id="btn-capture">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>记一条想法</span><kbd>⌘N</kbd>
    </button>

    <nav class="nav" id="nav">
      <a data-view="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg><span>首页</span></a>
      <a data-view="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.6V16h5.6v-.6c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg><span>想法</span><em id="n-ideas"></em></a>
      <a data-view="assets"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>素材</span><em id="n-assets"></em></a>
      <a data-view="notes"><svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg><span>笔记</span><em id="n-notes"></em></a>
      <a data-view="ai"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5"/><circle cx="12" cy="12" r="4"/></svg><span>AI 整理</span></a>
    </nav>

    <div class="side-sep"></div>
    <div class="side-label">最近</div>
    <div class="recent" id="recent"></div>

    <div class="side-foot">
      <a data-view="settings" class="foot-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span>设置</span></a>
      <div class="vault-tag" id="vault-tag" title="Obsidian 库">—</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="searchbox" id="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" placeholder="搜索笔记、想法、素材…" autocomplete="off">
        <kbd>⌘K</kbd>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-tabs" id="drawer-tabs"></div>
    <div class="drawer-actions" id="drawer-actions"></div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<div class="palette" id="palette" aria-hidden="true">
  <div class="palette-box">
    <input id="palette-input" placeholder="输入命令、标题或关键词…" autocomplete="off">
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot"><span>↑↓ 选择</span><span>↵ 打开</span><span>esc 关闭</span></div>
  </div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="lightbox" id="lightbox"><img alt=""></div>

<script src="/static/app.js"></script>
</body>
</html>
